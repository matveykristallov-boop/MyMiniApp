/* === visual polish / 3D cards / case effects === */
.card,.case-item,.inv-card,.reward-card{isolation:isolate}
.card:before,.case-item:before,.inv-card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#fff12 48%,transparent 67%);transform:translateX(-130%);transition:transform .7s ease;pointer-events:none;z-index:2}

.art{perspective:500px}
.art>*{transform:translateZ(16px)}
.case-item{position:relative;overflow:hidden;min-height:162px;transform:translateZ(0);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}

.case-item .case-orb{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 25%,#fff5,#ffffff0b 32%),linear-gradient(145deg,#252f40,#0a0f16);border:1px solid #ffffff16;box-shadow:0 10px 26px #0007,inset 0 1px #fff2;animation:orbFloat 2.6s ease-in-out infinite}
.case-item.legend-card .case-orb{background:radial-gradient(circle at 35% 25%,#fff8,#ffd86a26 26%,#2a1909 70%);border-color:#ffd86a55;box-shadow:0 0 28px #ffd86a25,0 10px 26px #0008}
.case-stage{height:275px;background:radial-gradient(circle at 50% 50%,#334969 0,#111927 31%,#080c13 70%);box-shadow:inset 0 0 55px #000b,0 20px 45px #0008}

.reward-card.reveal{animation:rewardCardIn .55s cubic-bezier(.2,1.4,.3,1)}

.inv-card{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.inv-card:hover{transform:translateY(-3px);box-shadow:0 16px 36px #0008}.inv-card.kept{border-color:#4c8b70;box-shadow:0 0 0 1px #3fe0a055,0 16px 34px #0008}

function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE)); if(s)return s}catch(e){} return {balance:1000,level:1,history:[],stats:{played:0,wins:0},inventory:[],daily:0,clicks:0}}

function fmt(n){return Math.floor(n).toLocaleString("ru-RU")}

function add(n,reason){n=Math.floor(n);if(!Number.isFinite(n)||n<=0)return;state.balance+=n;state.history.unshift({t:new Date().toLocaleTimeString(),r:reason,n});state.history=state.history.slice(0,60);save()}
function spend(n){n=Math.floor(Number(n));if(!Number.isFinite(n)||n<1){toast("Введите корректную ставку");return false}if(state.balance<n){toast("Не хватает фишек");return false}state.balance-=n;save();return true}
function toast(text){const x=document.createElement("div");x.textContent=text;x.style.cssText="position:fixed;z-index:999;left:50%;bottom:112px;transform:translateX(-50%);padding:12px 16px;background:#f2eedf;color:#10141c;border-radius:15px;font-weight:1000;box-shadow:0 12px 36px #000b;max-width:90%;text-align:center";document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function vibrate(pattern=[18]){if(settings.vibration&&navigator.vibrate){try{navigator.vibrate(pattern)}catch(e){}}}
function tone(freq=520,duration=.08,type="sine"){if(!settings.sound)return;try{if(!window._audio){window._audio=new (window.AudioContext||window.webkitAudioContext)()}const a=window._audio,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+duration);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration+.02)}catch(e){}}
function successFx(){tone(720,.1);vibrate([22,20,45])} function loseFx(){tone(190,.16,"sawtooth");vibrate([45,30,65])}

];

/* ROCKET */
function adminRocketTarget(){try{const c=JSON.parse(localStorage.getItem("needcrash_admin_v5")||"{}");return Number(c.rocketTarget||0)}catch(e){return 0}}
function rocketCrashPoint(){const forced=adminRocketTarget();if(forced>0)return Math.max(1.01,forced);const r=Math.random();const buckets=[{p:.35,a:1.02,b:1.35},{p:.35,a:1.35,b:2.0},{p:.15,a:2,b:3},{p:.08,a:3,b:5},{p:.05,a:5,b:10},{p:.015,a:10,b:20},{p:.005,a:20,b:30}];let s=0;for(const q of buckets){s+=q.p;if(r<=s)return q.a+Math.random()*(q.b-q.a)}return 1.05}
function gameRocket(){const hist=state.rocketHistory||[1.13,1.42,1.09,2.12,1.31,1.74,1.07,3.21];openModal("🚀 Ракета",`<div class="mult-history">${hist.slice(-8).map(x=>`<span class="mh ${x>=2?'good':''}">${x.toFixed(2)}x</span>`).join("")}</div><div class="rocket" id="rocketBox"><div class="rocket-core"><div class="rocket-x" id="rocketX">1.00x</div><div class="rocket-sub" id="rocketMsg">Приём ставок</div></div><div class="rocket-ship" id="rocketShip">🚀</div><div class="rocket-result" id="rocketResult"></div></div><label>Ставка</label><input id="rocketBet" type="number" min="1" value="10"><div class="row"><button class="btn" id="rocketStart" onclick="rocketStart()">🚀 Запустить</button><button class="btn alt" id="rocketCash" disabled onclick="rocketCashout()">Забрать 0</button></div><div class="msg">Админ может задать только максимальный X. Значение 0 означает обычный режим.</div>`)}
function rocketStart(){if(rocket.run)return;const bet=+document.getElementById("rocketBet").value;if(!spend(bet))return;rocket={run:true,bet,x:1,crash:rocketCrashPoint(),timer:null};document.getElementById("rocketStart").disabled=true;document.getElementById("rocketCash").disabled=true;document.getElementById("rocketBox").className="rocket live";document.getElementById("rocketMsg").textContent="🚀 Полёт начался";document.getElementById("rocketMsg").style.color="#63dcff";tone(460,.08);vibrate([14]);rocket.timer=setInterval(()=>{rocket.x+=.022+rocket.x*.012;document.getElementById("rocketX").textContent=rocket.x.toFixed(2)+"x";document.getElementById("rocketCash").textContent="Забрать "+fmt(rocket.bet*rocket.x);if(rocket.x>=1.05)document.getElementById("rocketCash").disabled=false;if(rocket.x>=rocket.crash)rocketCrash()},100)}
function rocketCrash(){if(!rocket.run)return;clearInterval(rocket.timer);rocket.run=false;const b=document.getElementById("rocketBox");b.className="rocket crashed";document.getElementById("rocketX").textContent=rocket.crash.toFixed(2)+"x";document.getElementById("rocketMsg").textContent="💥 Краш на "+rocket.crash.toFixed(2)+"x";document.getElementById("rocketMsg").style.color="#ff5e78";document.getElementById("rocketStart").disabled=false;document.getElementById("rocketCash").disabled=true;const r=document.getElementById("rocketResult");r.textContent="💥 КРАХ";r.className="rocket-result lose show";loseFx();state.stats.played++;state.rocketHistory=[...(state.rocketHistory||[]),rocket.crash].slice(-16);save()}
function rocketCashout(silent=false){if(!rocket.run)return;clearInterval(rocket.timer);rocket.run=false;const win=Math.floor(rocket.bet*rocket.x);add(win,"🚀 Ракета "+rocket.x.toFixed(2)+"x");state.stats.played++;state.stats.wins++;document.getElementById("rocketStart").disabled=false;document.getElementById("rocketCash").disabled=true;document.getElementById("rocketBox").className="rocket";document.getElementById("rocketMsg").textContent="✅ Забрано на "+rocket.x.toFixed(2)+"x";document.getElementById("rocketMsg").style.color="#4fe0a9";const r=document.getElementById("rocketResult");r.textContent="🎉 +"+fmt(win)+" ◈";r.className="rocket-result win show";successFx();state.rocketHistory=[...(state.rocketHistory||[]),rocket.x].slice(-16);save();if(!silent)toast("Забрано "+fmt(win)+" фишек")}

/* MINES */
function gameMines(){openModal("💣 Мины",`<div class="row"><div><label>Ставка</label><input id="mineBet" type="number" min="1" value="10"></div><div><label>Мин</label><select id="mineCount"><option value="3">3</option><option value="5">5</option><option value="8">8</option></select></div></div><div class="msg" id="mineMsg">Открой безопасную клетку, затем забери выигрыш.</div><div class="grid5" id="mineGrid"></div><div class="row"><button class="btn" onclick="mineNew()">Новый раунд</button><button class="btn alt" onclick="mineCashout()">Забрать</button></div>`)}
function mineNew(){if(mine?.active){toast("Текущий раунд ещё идёт");return}const bet=+document.getElementById("mineBet").value;if(!spend(bet))return;const count=+document.getElementById("mineCount").value;const mines=[];while(mines.length<count){const x=Math.floor(Math.random()*25);if(!mines.includes(x))mines.push(x)}mine={active:true,bet,mines,mult:1,safe:0};document.getElementById("mineGrid").innerHTML=Array.from({length:25},(_,i)=>`<button class="cell" onclick="minePick(${i},this)">?</button>`).join("");document.getElementById("mineMsg").textContent=`${count} мин · каждый безопасный ход увеличивает X`;vibrate([12])}
function minePick(i,b){if(!mine?.active||b.textContent!=="?")return;if(mine.mines.includes(i)){b.textContent="💣";b.classList.add("mine");mine.active=false;[...document.getElementById("mineGrid").children].forEach((x,j)=>{if(mine.mines.includes(j))x.textContent="💣"});document.getElementById("mineMsg").textContent="💥 Мина. Раунд закончен.";state.stats.played++;save();loseFx();return}mine.safe++;mine.mult*=mine.mines.length===3?1.15:mine.mines.length===5?1.23:1.35;b.textContent="✓";b.classList.add("safe");document.getElementById("mineMsg").textContent=`✅ ${mine.mult.toFixed(2)}x · забрать ${fmt(mine.bet*mine.mult)} ◈`;if(mine.safe===25-mine.mines.length){const win=Math.floor(mine.bet*mine.mult);mine.active=false;add(win,"💣 Мины — полный проход");state.stats.played++;state.stats.wins++;successFx()}}
function mineCashout(){if(!mine?.active||mine.safe<1){toast("Сначала открой безопасную клетку");return}const win=Math.floor(mine.bet*mine.mult);mine.active=false;add(win,"💣 Мины — кэшаут");state.stats.played++;state.stats.wins++;successFx();toast("Вы забрали "+fmt(win))}

/* PLINKO */
function gamePlinko(){openModal("🔵 Плинко",`<label>Ставка</label><input id="plinkoBet" type="number" min="1" value="10"><label>Риск</label><select id="plinkoRisk"><option value="low">Низкий</option><option value="mid" selected>Средний</option><option value="high">Высокий</option></select><div class="plinko" id="plinkoStage"><div class="ball" id="plinkoBall"></div><div class="slots" id="plinkoSlots"></div></div><div class="msg" id="plinkoMsg">Шарик готов.</div><button class="btn" id="plinkoBtn" onclick="dropPlinko()">🔵 Бросить</button>`);setTimeout(renderPlinko,0)}
function plinkoCfg(){const r=document.getElementById("plinkoRisk")?.value||"mid";if(r==="low")return {v:[.5,.75,1,1,1.2,1.4,1.7],w:[22,18,16,14,12,10,8]};if(r==="high")return {v:[.1,.25,.5,1,1.8,3,5],w:[35,24,15,10,7,5,4]};return {v:[.25,.5,.8,1,1.4,2,2.8],w:[28,22,17,13,9,7,4]}}
function renderPlinko(){const st=document.getElementById("plinkoStage"),ss=document.getElementById("plinkoSlots");if(!st||!ss)return;st.querySelectorAll(".peg").forEach(e=>e.remove());const w=st.clientWidth||330;for(let r=0;r<9;r++){const c=r%2?8:9;for(let i=0;i<c;i++){const p=document.createElement("i");p.className="peg";p.style.left=((i+.5)*(w/c)-4.5)+"px";p.style.top=(37+r*29)+"px";st.appendChild(p)}}const cfg=plinkoCfg();ss.innerHTML=cfg.v.map((x,i)=>`<div class="slot" data-i="${i}">${x}x</div>`).join("")}
function pickWeighted(w){let total=w.reduce((a,b)=>a+b,0),r=Math.random()*total;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1}
function dropPlinko(){if(plinkoBusy)return;const bet=+document.getElementById("plinkoBet").value;if(!spend(bet))return;plinkoBusy=true;document.getElementById("plinkoBtn").disabled=true;const st=document.getElementById("plinkoStage"),ball=document.getElementById("plinkoBall"),msg=document.getElementById("plinkoMsg"),cfg=plinkoCfg(),idx=pickWeighted(cfg.w),endX=st.clientWidth*((idx+.5)/7)-9;ball.style.left=(st.clientWidth/2-9)+"px";ball.style.top="8px";let x=st.clientWidth/2-9,y=8,step=0,total=11;function tick(){step++;x+=(endX-x)/(total-step+1)+(Math.random()-.5)*20;y+=27;ball.style.left=Math.max(6,Math.min(st.clientWidth-24,x))+"px";ball.style.top=y+"px";if(step<total){setTimeout(tick,95);return}ball.style.left=endX+"px";ball.style.top=(st.clientHeight-58)+"px";const s=st.querySelector(`.slot[data-i="${idx}"]`);s?.classList.add("hit");const mul=cfg.v[idx],payout=Math.floor(bet*mul);if(payout) add(payout,"🔵 Плинко "+mul+"x");state.stats.played++;if(mul>=1)state.stats.wins++;save();msg.textContent=`🎯 ${mul}x → ${payout?"+":""}${fmt(payout)} ◈`;if(payout)successFx();else loseFx();plinkoBusy=false;document.getElementById("plinkoBtn").disabled=false}tick()}
document.addEventListener("change",e=>{if(e.target?.id==="plinkoRisk")renderPlinko()});

/* SLOTS */
const SYM=["🍒","🍋","⭐","💎","7️⃣","🍉","🔔"];function spinSymbol(){return SYM[Math.floor(Math.random()*SYM.length)]}
function gameSlots(){openModal("🎰 Слоты",`<div class="slots-board" id="slotBoard">${Array.from({length:9},()=>`<div class="slot-cell">🎲</div>`).join("")}</div><label>Ставка</label><input id="slotBet" type="number" min="1" value="10"><div class="msg" id="slotMsg">3 одинаковых символа по линии = выигрыш.</div><button class="btn" onclick="spinSlots()">🎰 Крутить</button>`)}
function spinSlots(){if(slotsBusy)return;const bet=+document.getElementById("slotBet").value;if(!spend(bet))return;slotsBusy=true;const board=[...Array(9)].map(spinSymbol),grid=document.getElementById("slotBoard");grid.innerHTML=board.map((s,i)=>`<div class="slot-cell" style="animation:float .38s ${i*35}ms ease both">${s}</div>`).join("");setTimeout(()=>{if(!document.body.contains(grid)){slotsBusy=false;return}const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],wins=lines.filter(l=>board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]]),payout=wins.length?Math.floor(bet*(board[wins[0][0]]==="7️⃣"?8:board[wins[0][0]]==="💎"?5:3))*wins.length:0;wins.flat().forEach(i=>grid.children[i].classList.add("win"));if(payout){add(payout,"🎰 Слоты");state.stats.wins++;successFx()}else loseFx();state.stats.played++;state.stats.lastSlot=payout;save();document.getElementById("slotMsg").innerHTML=payout?`🎉 +${fmt(payout)} ◈`:`Нет линии — попробуй ещё`;slotsBusy=false},460)}

/* DICE */
function gameDice(){openModal("🎲 Кости",`<label>Ставка</label><input id="diceBet" type="number" min="1" value="10"><div class="statgrid"><div class="stat"><small>Вы</small><strong id="diceYou">—</strong></div><div class="stat"><small>Дилер</small><strong id="diceD">—</strong></div></div><button class="btn" onclick="rollDice()">Бросить</button><div class="msg" id="diceMsg">Брось две кости против дилера.</div>`)}
function rollDice(){const bet=+document.getElementById("diceBet").value;if(!spend(bet))return;const a=2+Math.floor(Math.random()*11),d=2+Math.floor(Math.random()*11);document.getElementById("diceYou").textContent=a;document.getElementById("diceD").textContent=d;let payout=0;if(a>d)payout=Math.floor(bet*1.8);else if(a===d)payout=bet;document.getElementById("diceMsg").textContent=a>d?`🎉 Победа +${fmt(payout)} ◈`:a===d?`Ничья · ставка возвращена`:`❌ Дилер сильнее`;if(payout)add(payout,"🎲 Кости");state.stats.played++;if(a>d)state.stats.wins++;save();payout?successFx():loseFx()}

function gameFortune(){openModal("🔮 Фортуна",`<div class="hero"><h1>Выбери одну карту</h1><p>Одна карта даёт большой множитель, две — меньший.</p></div><div class="grid3" id="fortuneGrid" style="margin-top:12px">${[0,1,2].map(i=>`<button class="cell" style="aspect-ratio:.72;font-size:38px" onclick="pickFortune(${i},this)">?</button>`).join("")}</div><label>Ставка</label><input id="fortuneBet" type="number" min="1" value="10"><div class="msg" id="fortuneMsg">Карта определяется при выборе.</div>`)}

function caseReward(c){return c.rewards[Math.floor(Math.random()*c.rewards.length)]}
function gameCases(){openCasesHome()}
function openCasesHome(){openModal("📦 Кейсы",`<div class="tiny-tabs"><button id="caseTabOpen" class="active" onclick="renderCaseTab('case')">Все кейсы</button><button id="caseTabLegend" onclick="renderCaseTab('legend')">Legend</button><button id="caseTabInv" onclick="renderCaseTab('inventory')">Инвентарь <span id="invCountBadge"></span></button></div><div id="caseTabBody"></div>`);renderCaseTab("case")}
function renderCaseTab(tab){document.querySelectorAll('.tiny-tabs button').forEach(b=>b.classList.remove('active'));const btn={case:'caseTabOpen',legend:'caseTabLegend',inventory:'caseTabInv'}[tab];document.getElementById(btn)?.classList.add('active');if(tab==='inventory'){renderInventory();return}if(tab==='legend'){document.getElementById('caseTabBody').innerHTML=`<button class="case-item legend-card" onclick="openLegend()"><div class="case-orb">👑</div><h3>Legend</h3><p>Особые подарки и редкие находки. Подарок после открытия попадает в инвентарь.</p><div style="margin-top:10px" class="case-price-badge">◈ ${fmt(LEGEND.price)}</div></button>`;return}document.getElementById('caseTabBody').innerHTML=`<div class="case-list">${CASES.map((c,i)=>`<button class="case-item ${c.id==='gold'?'case-gold':''} ${c.id==='cosmic'?'case-cosmic':''}" onclick="openRegularCase('${c.id}')"><div class="case-orb">${c.icon}</div><h3>${c.name}</h3><p>Набор виртуальных наград. Максимум — ${fmt(Math.max(...c.rewards))} ◈.</p><div style="margin-top:10px" class="case-price-badge">◈ ${fmt(c.price)}</div></button>`).join('')}
</div><div class="msg">Выбери кейс, открой его анимацией и получи виртуальную награду.</div>`}
function openRegularCase(id){const c=CASES.find(x=>x.id===id);if(!c)return;openModal(c.icon+' '+c.name,`<div class="case-stage" id="regularCaseStage"><div class="box" id="regularCaseBox">${c.icon}</div><div class="case-burst" id="regularBurst">✨</div></div><div id="regularCaseReward" class="reward-card"><div class="gift">🎁</div><h3>Кейс готов</h3><p>Открой кейс и получи случайную виртуальную награду.</p><div class="value">до ${fmt(Math.max(...c.rewards))} ◈</div></div><button class="btn" id="regularCaseBtn" onclick="openRegularCaseNow('${c.id}')">📦 Открыть за ${fmt(c.price)} ◈</button><button class="btn alt" onclick="openCasesHome()">← Все кейсы</button>`)}
function openRegularCaseNow(id){if(caseBusy)return;const c=CASES.find(x=>x.id===id);if(!c||!spend(c.price))return;caseBusy=true;const stage=document.getElementById('regularCaseStage'),burst=document.getElementById('regularBurst'),btn=document.getElementById('regularCaseBtn');if(btn)btn.disabled=true;stage?.classList.add('opening');setTimeout(()=>burst?.classList.add('show'),230);tone(260,.09,'triangle');vibrate([15,15,25]);setTimeout(()=>{const reward=caseReward(c);stage?.classList.remove('opening');const out=document.getElementById('regularCaseReward');if(out){out.classList.add('reveal');out.innerHTML=`<div class="gift">${reward? '🪙':'🌫️'}</div><h3>${reward? 'Награда получена':'Пусто'}</h3><p>${reward?'Фишки зачислены на баланс.':'В этот раз награда не выпала.'}</p><div class="value">${reward? '+'+fmt(reward)+' ◈':'0 ◈'}</div>`;if(reward){add(reward,'📦 '+c.name);state.stats.wins++;successFx()}else{loseFx()}}state.stats.played++;save();caseBusy=false;},850)}
function openLegend(){currentCase='legend';openModal('👑 Legend',`<div class="case-stage" id="caseStage"><div class="box" id="caseBox">👑</div><div class="case-burst" id="caseBurst">✨</div></div><div id="caseReward" class="reward-card"><div class="gift">🎁</div><h3>Legend готов</h3><p>Редкий подарок попадёт в инвентарь. Его можно оставить или продать.</p><div class="value">◈ ${fmt(LEGEND.price)}</div></div><button class="btn" id="legendOpenBtn" onclick="openLegendCase()">📦 Открыть за ${fmt(LEGEND.price)} ◈</button><button class="btn alt" onclick="openCasesHome()">← Назад</button>`)}
function openLegendCase(){if(caseBusy||!spend(LEGEND.price))return;caseBusy=true;const stage=document.getElementById('caseStage'),burst=document.getElementById('caseBurst'),btn=document.getElementById('legendOpenBtn');btn?.setAttribute('disabled','true');stage?.classList.add('opening');tone(230,.1,'triangle');vibrate([18,18,35]);setTimeout(()=>burst?.classList.add('show'),300);setTimeout(()=>{const id=rollLegend();stage?.classList.remove('opening');const out=document.getElementById('caseReward');if(!out){caseBusy=false;return}out.classList.add('reveal');if(!id){out.innerHTML=`<div class="gift">🌫️</div><h3>Пусто</h3><p>В этот раз подарок не выпал.</p><div class="value">0 ◈</div>`;loseFx()}else{const g=GIFTS[id];const uid=(crypto.randomUUID?.()||('gift-'+Date.now()+'-'+Math.random().toString(36).slice(2)));state.inventory=Array.isArray(state.inventory)?state.inventory:[];state.inventory.push({uid,giftId:id,kept:false,created:Date.now()});save();out.innerHTML=`<div class="gift">${g.icon}</div><h3>${g.name}</h3><p>Подарок добавлен в инвентарь. Его можно сохранить или продать.</p><div class="value">${fmt(g.value)} ◈</div>`;successFx();}state.stats.played++;save();caseBusy=false;btn?.removeAttribute('disabled')},950)}
function renderInventory(){const body=document.getElementById('caseTabBody');if(!body)return;state.inventory=Array.isArray(state.inventory)?state.inventory:[];const inv=state.inventory;if(document.getElementById('invCountBadge'))document.getElementById('invCountBadge').textContent=inv.length?`· ${inv.length}`:'';body.innerHTML=inv.length?`<div class="inventory-grid">${inv.map((it,i)=>{const g=GIFTS[it.giftId];if(!g)return '';return `<article class="inv-card ${it.kept?'kept':''}" data-uid="${it.uid}"><div class="inv-top"><div class="inv-gift">${g.icon}</div><div style="color:#a0abbd;font-size:11px">#${i+1}</div></div><h3>${g.name}</h3><p>${fmt(g.value)} ◈ · ${it.kept?'в коллекции':'доступен для продажи'}</p><div class="drag-handle" data-drag-handle="1">☷ Перетащить</div><div class="inv-actions"><button class="btn alt" onclick="sellGift('${it.uid}')">Продать</button><button class="btn" onclick="keepGift('${it.uid}')">${it.kept?'Сохранено':'Оставить'}</button></div></article>`}).join('')}</div><div class="notice">Перетаскивай подарок за полоску «Перетащить». Порядок сохраняется даже после перезапуска.</div>`:`<div class="msg">Инвентарь пуст. Открой Legend и найди первый подарок.</div>`;bindInventoryDrag()}
function bindInventoryDrag(){document.querySelectorAll('.drag-handle').forEach(handle=>{handle.addEventListener('pointerdown',startGiftDrag,{passive:false})})}
let dragSession=null;
function startGiftDrag(e){e.preventDefault();const card=e.currentTarget.closest('.inv-card');if(!card)return;const uid=card.dataset.uid;dragSession={uid,card,startX:e.clientX,startY:e.clientY,moved:false};card.classList.add('drag-source');card.setPointerCapture?.(e.pointerId);card.addEventListener('pointermove',moveGiftDrag);card.addEventListener('pointerup',endGiftDrag,{once:true});card.addEventListener('pointercancel',cancelGiftDrag,{once:true});vibrate([8]);}
function moveGiftDrag(e){if(!dragSession)return;const dx=e.clientX-dragSession.startX,dy=e.clientY-dragSession.startY;if(Math.hypot(dx,dy)>6)dragSession.moved=true;document.querySelectorAll('.inv-card').forEach(c=>c.classList.remove('drop-target'));const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.inv-card');if(el&&el!==dragSession.card)el.classList.add('drop-target')}
function endGiftDrag(e){if(!dragSession)return;const session=dragSession;session.card.classList.remove('drag-source');session.card.removeEventListener('pointermove',moveGiftDrag);document.querySelectorAll('.inv-card').forEach(c=>c.classList.remove('drop-target'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.inv-card');if(target&&target!==session.card&&session.moved){const arr=state.inventory,a=arr.findIndex(x=>x.uid===session.uid),b=arr.findIndex(x=>x.uid===target.dataset.uid);if(a>=0&&b>=0){[arr[a],arr[b]]=[arr[b],arr[a]];save();renderInventory();successFx();}}dragSession=null}
function cancelGiftDrag(){if(!dragSession)return;dragSession.card.classList.remove('drag-source');dragSession.card.removeEventListener('pointermove',moveGiftDrag);dragSession=null;document.querySelectorAll('.inv-card').forEach(c=>c.classList.remove('drop-target'))}
function sellGift(uid){const i=(state.inventory||[]).findIndex(x=>x.uid===uid);if(i<0)return;const g=GIFTS[state.inventory[i].giftId];if(!g)return;state.inventory.splice(i,1);add(g.value,'🎁 Продажа '+g.name);successFx();renderInventory()}
function keepGift(uid){const i=(state.inventory||[]).findIndex(x=>x.uid===uid);if(i<0)return;state.inventory[i].kept=true;save();successFx();renderInventory();toast('Подарок оставлен в коллекции')}

/* PROFILE / SETTINGS */
function openProfile(){openModal("◉ Профиль",`<div class="statgrid"><div class="stat"><small>Telegram ID</small><strong style="font-size:13px">${userId}</strong></div><div class="stat"><small>Фишки</small><strong>${fmt(state.balance)}</strong></div><div class="stat"><small>Игр</small><strong>${state.stats.played}</strong></div><div class="stat"><small>Побед</small><strong>${state.stats.wins}</strong></div></div><div class="case-item" onclick="openCasesHome()" style="margin-bottom:10px"><div class="icon">📦</div><h3>Кейсы и инвентарь</h3><p>Legend, подарки и сортировка drag & drop.</p></div><div class="case-item" onclick="openSettings()"><div class="icon">⚙️</div><h3>Настройки</h3><p>Звук и вибрация.</p></div><button class="btn alt" onclick="showHistory()">История операций</button>${isAdmin?`<button class="btn alt" onclick="openAdmin()">🛠 Панель администратора</button>`:""}`)}
function openSettings(){openModal("⚙️ Настройки",`<div class="settings-row"><span>🔊 Звуки</span><button class="switch ${settings.sound?'on':''}" onclick="toggleSetting('sound',this)"></button></div><div class="settings-row"><span>📳 Вибрация</span><button class="switch ${settings.vibration?'on':''}" onclick="toggleSetting('vibration',this)"></button></div><div class="msg">Настройки сохраняются отдельно для этого пользователя.</div>`)}
function toggleSetting(k,btn){settings[k]=!settings[k];saveSettings();btn.classList.toggle("on",settings[k]);if(k==="sound")tone(650,.05);if(k==="vibration")vibrate([24])}
function showHistory(){openModal("История",`<div class="log">${(state.history||[]).slice(0,30).map(x=>`<div class="log-row"><span>${x.r}<br><small>${x.t}</small></span><span class="${x.n>=0?'plus':'minus'}">${x.n>=0?'+':''}${fmt(x.n)}</span></div>`).join("")||'<div class="msg">История пуста.</div>'}</div>`)}

/* ADMIN: ONLY ROCKET */
function openAdmin(){if(!isAdmin)return;let target=adminRocketTarget();openModal("🛠 Панель администратора",`<section class="hero admin"><h3>🚀 Управление ракетой</h3><p class="admin-note">Только это поле влияет на ракету. 0 = обычный случайный режим. Значение больше 0 означает точный X, на котором раунд завершится.</p><label>Краш X (0 = обычный режим)</label><input id="adminRocketTarget" type="number" min="0" step="0.01" value="${target}"><button class="btn" onclick="saveAdmin()">Сохранить</button><div class="msg">Сейчас: ${target>0?`точный краш на ${target}x`:'обычный режим'}</div></section>`)}
function saveAdmin(){let v=Number(document.getElementById("adminRocketTarget").value||0);if(!Number.isFinite(v)||v<=0)v=0;else v=Math.max(1.01,v);localStorage.setItem("needcrash_admin_v5",JSON.stringify({rocketTarget:v}));toast("Настройки ракеты сохранены")}
function renderAdmin(){if(!isAdmin)return;document.getElementById("adminBox").innerHTML=`<section class="hero admin"><h3>🛠 Админ</h3><p class="admin-note">Открыть управление только для ракеты.</p><button class="btn alt" onclick="openAdmin()">Открыть панель</button></section>`}

/* BONUS */
function openTasks(){openModal("◇ Бонусы",`<div class="hero"><h1>🎁 Ежедневный бонус</h1><p>Один раз в сутки можно забрать случайную награду 100–5000 фишек.</p></div><button class="btn green" onclick="dailyBonus()">Получить бонус</button><div class="msg">Последний бонус: ${state.daily?new Date(state.daily).toLocaleString():"ещё не получен"}</div>`)}
function dailyBonus(){const now=Date.now();if(state.daily&&new Date(state.daily).toDateString()===new Date(now).toDateString()){toast("Сегодня бонус уже получен");return}const n=100+Math.floor(Math.random()*4901);state.daily=now;add(n,"🎁 Ежедневный бонус");successFx();toast("+"+fmt(n)+" фишек")}

/* NAV */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderGames(b.dataset.mode)});
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.nav==="games"){renderGames("all");scrollTo({top:0,behavior:"smooth"})}else if(b.dataset.nav==="profile")openProfile();else if(b.dataset.nav==="friends")openModal("♧ Друзья",`<div class="hero"><h1>Приглашай друзей</h1><p>Реферальная ссылка для Telegram.</p></div><div class="msg" style="word-break:break-all">https://t.me/${REF_BOT}?startapp=ref_${encodeURIComponent(userId)}</div><button class="btn" onclick="copyText('https://t.me/${REF_BOT}?startapp=ref_${encodeURIComponent(userId)}')">Копировать ссылку</button>`);else openTasks()});
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Ссылка скопирована")}catch(e){prompt("Скопируй ссылку",t)}}
updateUI();renderGames();renderAdmin();
</script>
</body>
</html>
