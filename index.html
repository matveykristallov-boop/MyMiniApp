<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<title>NeedCrush — Virtual Lounge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#070910;--panel:#0d111b;--panel2:#131927;--line:#242c3b;
  --text:#f7f8fc;--muted:#8791a5;--gold:#ffd76a;--gold2:#ffedaa;
  --green:#43e0a0;--red:#ff5575;--blue:#72a7ff;--cyan:#68e5ff;
  --shadow:0 20px 55px #0009;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer}
.app{min-height:100vh;padding-bottom:96px;background:
 radial-gradient(650px 300px at 90% -5%,#3158a833,transparent 68%),
 radial-gradient(500px 330px at -5% 25%,#4d315d2a,transparent 70%),
 linear-gradient(180deg,#070910,#090c13 55%,#070910)}
.top{position:sticky;top:0;z-index:20;background:#080a10e8;backdrop-filter:blur(18px);border-bottom:1px solid #1d2431}
.head{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;letter-spacing:-.4px}
.logo{width:39px;height:39px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2d2548,#111827);border:1px solid #5a4e80;box-shadow:0 0 25px #8b5cff22;font-size:20px}
.balance{display:flex;align-items:center;gap:7px;background:#10151f;border:1px solid #30384a;border-radius:17px;padding:8px 12px;font-weight:900;box-shadow:0 8px 25px #0005}
.coin{color:var(--gold);text-shadow:0 0 10px #ffd76a66}
.tabs{display:flex;gap:8px;padding:8px 13px 13px;overflow:auto}
.tab{flex:1;min-width:105px;padding:11px;border-radius:16px;background:#0d1119;border:1px solid #202735;color:#9099aa;font-weight:800}
.tab.active{background:linear-gradient(180deg,#ffe99c,#eab84c);color:#17120a;border-color:#ffe9a3;box-shadow:0 6px 24px #e4b64c33}
.page{padding:14px;max-width:980px;margin:auto}
.hero{border:1px solid #293143;background:
 radial-gradient(250px 120px at 85% 10%,#314c8333,transparent 70%),
 linear-gradient(145deg,#121826,#0c1018);border-radius:25px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:25px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);line-height:1.45}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px;font-size:18px;font-weight:900}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{min-height:174px;border:1px solid #252d3d;border-radius:23px;overflow:hidden;background:linear-gradient(145deg,#121722,#0b0e15);box-shadow:0 12px 32px #0006;transition:.16s}
.card:active{transform:scale(.985)}
.art{height:104px;display:grid;place-items:center;font-size:49px;background:
 radial-gradient(circle at 50% 45%,#7a4de433,transparent 31%),linear-gradient(145deg,#1a2030,#0b0e15)}
.card:nth-child(3n) .art{background:radial-gradient(circle,#35a98233,transparent 32%),linear-gradient(145deg,#12241f,#0b1110)}
.card:nth-child(3n+1) .art{background:radial-gradient(circle,#4d77c933,transparent 32%),linear-gradient(145deg,#171d2d,#0b0e14)}
.card-body{padding:11px 13px 13px}.card h3{margin:0 0 4px;font-size:17px}.card p{margin:0;color:#8992a2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:fixed;z-index:30;bottom:10px;left:10px;right:10px;border:1px solid #2a3343;border-radius:26px;background:#0e131deF;backdrop-filter:blur(22px);display:flex;justify-content:space-around;padding:7px;box-shadow:0 15px 45px #000c}
.nav{flex:1;text-align:center;color:#707b8e;padding:6px 3px;border-radius:19px;font-size:10px;font-weight:800}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav.active{background:#24202a;color:var(--gold)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#000b}.modal.show{display:flex}
.sheet{width:100%;max-height:94vh;overflow:auto;background:#0b0f17;border:1px solid #303949;border-radius:29px 29px 0 0;padding:17px;box-shadow:0 -25px 70px #000c}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{margin:0;font-size:23px}
.close{width:39px;height:39px;border-radius:50%;background:#191f2b;color:#b5bfce;font-size:23px}
.btn{width:100%;padding:14px 15px;border-radius:16px;background:linear-gradient(180deg,#ffe69a,#e8b846);color:#17120a;font-weight:900;margin-top:10px;box-shadow:0 7px 22px #d9aa4030}
.btn.alt{background:#171e2a;color:#e2e7ef;border:1px solid #30394a;box-shadow:none}.btn.danger{background:#e85370;color:#fff}.btn.green{background:linear-gradient(180deg,#69efba,#32c88c);color:#07150f}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select{width:100%;padding:13px;border-radius:14px;background:#080c13;border:1px solid #30394a;color:#fff;outline:none}
input:focus,select:focus{border-color:#637ba5;box-shadow:0 0 0 3px #617ca51c}
label{display:block;color:#9ca6b7;font-size:12px;margin:11px 0 5px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.stat{background:#121823;border:1px solid #283142;border-radius:16px;padding:12px}.stat small{color:#8993a4}.stat strong{display:block;font-size:20px;margin-top:3px}
.msg{padding:12px;border-radius:14px;background:#121823;border:1px solid #222b3a;color:#b6bfce;margin-top:10px;line-height:1.4}
.notice{font-size:12px;color:#778294;margin-top:10px;line-height:1.45}
.admin{border-color:#725e2b;background:linear-gradient(145deg,#211b0d,#121820)}
.promo-code{display:flex;align-items:center;gap:8px;margin-top:10px}.promo-code code{flex:1;display:block;padding:13px;border-radius:13px;background:#070a10;border:1px solid #3a4353;font-size:18px;font-weight:900;letter-spacing:1px;text-align:center;color:var(--gold)}
.copy{padding:12px;border-radius:13px;background:#242c3b;font-weight:900}
.check-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #222a38;font-size:13px;color:#aeb7c6}
.history{max-height:150px;overflow:auto}.history div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #242b38;color:#aeb7c3;font-size:12px}
.history .plus{color:var(--green);font-weight:800}.history .minus{color:var(--red);font-weight:800}
.mult-history{display:flex;gap:7px;overflow:hidden;margin:10px 0}.mh{flex:0 0 auto;padding:8px 11px;border-radius:12px;background:#321c23;border:1px solid #55303a;color:#ff899b;font-size:12px;font-weight:900}.mh.good{background:#103b2d;border-color:#216f54;color:#65e4ad}
.rocket-box{height:330px;border-radius:25px;border:1px solid #293345;position:relative;overflow:hidden;background:
 radial-gradient(circle at 20% 18%,#fff9 0 1px,transparent 2px),
 radial-gradient(circle at 78% 28%,#fff7 0 1px,transparent 2px),
 radial-gradient(circle at 62% 65%,#fff5 0 1px,transparent 2px),
 linear-gradient(180deg,#090d15,#070a10)}
.rocket-box:before,.rocket-box:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#1d2432 1px,transparent 1px),linear-gradient(90deg,#1d2432 1px,transparent 1px);background-size:100% 20%,20% 100%;opacity:.35;transform:perspective(400px) rotateX(58deg) scale(1.7) translateY(35%)}
.rocket-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.rocket-x{font-size:61px;font-weight:1000;letter-spacing:-3px;text-shadow:0 0 25px #ffe27c55}
.rocket-sub{color:#8d98aa;font-size:12px}.rocket-ship{font-size:50px;position:absolute;left:9%;bottom:12%;filter:drop-shadow(0 0 16px #ffcb4b);transition:.15s}
.rocket-box.live .rocket-ship{animation:fly .7s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(0,5px) rotate(-8deg)}to{transform:translate(110px,-120px) rotate(-18deg)}}
.crash{color:#ff647f}.live{color:#68e5ff}
.cashout-bar{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cashout-bar .btn{margin-top:0}
.cardface{width:105px;height:145px;border-radius:18px;background:#f6f6f4;color:#171a20;display:grid;place-items:center;font-size:39px;font-weight:1000;margin:0 auto;box-shadow:0 15px 35px #0007;position:relative}
.cardface.red{color:#e24461}.cardface:after{content:"";position:absolute;inset:8px;border:1px solid #d4d4d0;border-radius:12px}
.hilo-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hilo-actions .btn{margin-top:0}
.mult-big{text-align:center;font-size:31px;font-weight:1000;color:var(--gold);margin:7px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;border-radius:17px;background:#151c28;border:1px solid #30394a;display:grid;place-items:center;font-size:28px;font-weight:800}.cell.safe{background:#123e31;border-color:#45d6a0}.cell.mine{background:#471925;border-color:#ff5d75}
@media(min-width:760px){.page{padding:20px}.games{grid-template-columns:repeat(3,1fr)}.bottom{left:50%;right:auto;width:720px;transform:translateX(-50%)}}

.cell.safe{background:linear-gradient(145deg,#1ee29a,#087b59)!important;border-color:#7dffd0!important;color:#fff!important;box-shadow:0 0 0 2px #45f0b055,0 0 25px #31e09a88;animation:safePulse .45s ease}
.cell.selected{background:linear-gradient(145deg,#43f0a8,#087b59)!important;border-color:#b8ffe5!important;box-shadow:0 0 0 3px #6dffc577,0 0 30px #36e8a0aa}
@keyframes safePulse{0%{transform:scale(.88);filter:brightness(1.4)}100%{transform:scale(1);filter:brightness(1)}}
.ref-card{border:1px solid #4a3d20;background:radial-gradient(circle at 85% 0,#ffd76a20,transparent 45%),linear-gradient(145deg,#1a1710,#10151e);border-radius:22px;padding:15px;box-shadow:0 14px 35px #0007}
.ref-link{display:flex;gap:8px;align-items:center;margin-top:10px}.ref-link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#070a10;border:1px solid #30394a;padding:12px;border-radius:13px;color:var(--gold);font-size:12px}
.ref-stat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.upgrade-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.upgrade-choice{padding:11px 4px;border-radius:13px;background:#121823;border:1px solid #30394a;color:#aab4c4;font-weight:900}
.upgrade-choice.active{background:linear-gradient(180deg,#ffe79a,#e5b443);color:#16120a;border-color:#ffeaa9;box-shadow:0 0 18px #e9b94c33}
.upgrade-wheel-wrap{position:relative;width:min(320px,84vw);height:min(320px,84vw);margin:16px auto 12px;display:grid;place-items:center;filter:drop-shadow(0 18px 28px #0009)}
.upgrade-wheel-wrap:before{content:"";position:absolute;top:-4px;z-index:8;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:27px solid #ffe28a;filter:drop-shadow(0 2px 5px #000);transform:rotate(180deg)}
.upgrade-wheel-wrap:after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid #fff2a455;box-shadow:0 0 0 7px #151b28,0 0 0 9px #70572a,0 0 30px #e5b94a44;pointer-events:none;z-index:5}
.upgrade-wheel{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;border:8px solid #151b27;background:conic-gradient(#4b3320 0deg 51.43deg,#172d43 51.43deg 102.86deg,#4d3920 102.86deg 154.29deg,#182f28 154.29deg 205.72deg,#443022 205.72deg 257.15deg,#26334b 257.15deg 308.58deg,#53361e 308.58deg 360deg);transition:transform 4.2s cubic-bezier(.08,.73,.09,1);box-shadow:inset 0 0 35px #000b,0 0 0 1px #b98d3c}
.upgrade-wheel.spinning{filter:brightness(1.12) saturate(1.12);box-shadow:inset 0 0 35px #000b,0 0 30px #ffd45a55}
.upgrade-wheel-center{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);z-index:4;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffeeb0,#d9a73d 55%,#8d6424);border:4px solid #fff0a0;box-shadow:0 5px 20px #000a,inset 0 0 12px #fff8;font-size:22px;color:#221a0b;font-weight:1000}
.upgrade-label{position:absolute;left:50%;top:50%;width:76px;margin-left:-38px;margin-top:-15px;text-align:center;font-size:19px;font-weight:1000;color:#fff;line-height:30px;text-shadow:0 2px 4px #000,0 0 8px #000;z-index:3;transform:rotate(var(--r)) translateY(-105px) rotate(calc(-1 * var(--r)))}
.upgrade-wheel-pointer{position:absolute;top:13px;z-index:9;width:8px;height:30px;border-radius:5px;background:#ffe28a;box-shadow:0 0 12px #ffd45a,0 2px 5px #000}
.upgrade-wheel-status{text-align:center;font-weight:900;color:#aeb8c9;margin:4px 0 10px}.upgrade-wheel-status b{color:#ffe18a}


/* === NeedCrush v2 additions === */
.upgrade-v2{padding:2px 0}
.upgrade-ring-wrap{position:relative;width:min(330px,88vw);height:min(330px,88vw);margin:8px auto 14px;display:grid;place-items:center}
.upgrade-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,#252b35 0deg 45deg,#454d5a 45deg 90deg,#252b35 90deg 135deg,#454d5a 135deg 180deg,#252b35 180deg 225deg,#454d5a 225deg 270deg,#252b35 270deg 315deg,#454d5a 315deg 360deg);box-shadow:inset 0 0 0 2px #ffffff12,0 14px 45px #0009}
.upgrade-ring:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#090c12;border:2px solid #343b49}
.upgrade-ring:after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid #ffffff12}
.upgrade-pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);z-index:5;width:6px;height:27px;border-radius:0 0 5px 5px;background:#ffe28a;box-shadow:0 0 12px #ffe28a}
.upgrade-core{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);z-index:4;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#15171e;border:1px solid #343b49;box-shadow:0 10px 30px #0009}
.upgrade-core strong{display:block;font-size:39px;line-height:1;font-weight:1000}.upgrade-core span{display:block;margin-top:8px;color:#b8bec9;font-size:14px}
.upgrade-ring.spin{animation:upgradeSpin 2.8s cubic-bezier(.08,.76,.08,1)}@keyframes upgradeSpin{to{transform:rotate(1440deg)}}.upgrade-result{display:none;text-align:center;font-size:31px;font-weight:1000;margin:12px 0 4px;letter-spacing:.5px}.upgrade-result.show{display:block;animation:resultPop .35s ease}.upgrade-result.win{color:#5fe09a}.upgrade-result.lose{color:#ff667e}@keyframes resultPop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.upgrade-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.upgrade-amount{padding:12px 4px;border-radius:14px;background:#10151f;border:1px solid #2a3342;color:#aeb7c6;font-weight:900}.upgrade-amount.active{background:#24252b;border-color:#626876;color:#fff}
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.case-item{padding:13px;border:1px solid #2a3342;border-radius:18px;background:linear-gradient(145deg,#151b27,#0c1017);text-align:left}
.case-icon{font-size:38px;margin-bottom:6px}.case-item h3{margin:0 0 3px}.case-item p{margin:0;color:#8d97a8;font-size:12px}.case-price{margin-top:10px;color:var(--gold);font-weight:1000}
.task-card{border:1px solid #2d3545;border-radius:20px;padding:15px;background:linear-gradient(145deg,#141a25,#0c1017);margin-top:10px}.task-head{display:flex;gap:12px;align-items:center}.task-icon{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#202633;font-size:23px}.task-head h3{margin:0 0 3px}.task-head p{margin:0;color:#8d97a8;font-size:12px}.task-card .btn{margin-top:12px}
.clicker-zone{display:grid;place-items:center;margin:14px 0}.clicker-btn{width:min(250px,70vw);height:min(250px,70vw);border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff0b7,#f0c85e 45%,#9c6f25 100%);border:8px solid #ffe9a1;color:#1c160a;font-size:42px;font-weight:1000;box-shadow:0 18px 45px #0009,0 0 40px #ffd75a33}.clicker-btn:active{transform:scale(.96)}
.clicker-ban{border-color:#713244;background:#28131b;color:#ff9db0}
@media(max-width:430px){.case-grid{grid-template-columns:1fr}.upgrade-amounts{grid-template-columns:repeat(2,1fr)}}


/* === v3 animations === */
.upgrade-ring{will-change:transform;transition:transform 2.8s cubic-bezier(.08,.76,.08,1)}
.upgrade-ring.spin{animation:none}
.upgrade-pointer{filter:drop-shadow(0 0 8px #ffe28a99)}
.case-open-stage{position:relative;height:190px;display:grid;place-items:center;overflow:hidden;border-radius:22px;background:radial-gradient(circle,#252d3b,#090d14 68%);border:1px solid #313a4b;margin:10px 0}
.case-glow{position:absolute;width:170px;height:170px;border-radius:50%;background:#ffd76a22;filter:blur(18px);animation:caseGlow 1.2s ease-in-out infinite alternate}
.case-box{position:relative;font-size:82px;z-index:2;animation:caseFloat 1s ease-in-out infinite alternate;filter:drop-shadow(0 12px 20px #0009)}
.case-box.opening{animation:caseShake .75s ease-in-out infinite}
.case-burst{position:absolute;inset:0;display:grid;place-items:center;font-size:70px;opacity:0;transform:scale(.2)}
.case-burst.show{animation:caseBurst .7s ease-out forwards}
.case-reward{font-size:27px;font-weight:1000;text-align:center;opacity:0;transform:translateY(15px) scale(.7)}
.case-reward.show{animation:rewardReveal .55s cubic-bezier(.2,1.5,.3,1) .15s forwards}
@keyframes caseFloat{from{transform:translateY(-5px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
@keyframes caseShake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.05)}80%{transform:rotate(5deg) scale(1.08)}}
@keyframes caseGlow{from{transform:scale(.8);opacity:.5}to{transform:scale(1.25);opacity:1}}
@keyframes caseBurst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(2)}}
@keyframes rewardReveal{to{opacity:1;transform:translateY(0) scale(1)}}
.tower-wrap{position:relative;min-height:370px;overflow:hidden;border-radius:22px;background:linear-gradient(#0c111a,#070a10);border:1px solid #273142;padding:12px}
.tower-sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 10%,#687b9918,transparent 42%);pointer-events:none}
.tower-building{position:relative;display:flex;flex-direction:column-reverse;gap:7px;min-height:330px;justify-content:flex-start;padding-top:8px}
.tower-floor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;opacity:.55;transform:translateY(30px) scale(.96);transition:.35s}
.tower-floor.current{opacity:1;transform:translateY(0) scale(1)}
.tower-floor.passed{opacity:.45;transform:scale(.96)}
.tower-cell{height:58px;border-radius:15px;background:linear-gradient(145deg,#182130,#0f151f);border:1px solid #354052;display:grid;place-items:center;font-size:25px;font-weight:1000;transition:.25s;box-shadow:inset 0 1px #ffffff08}
.tower-cell:hover{transform:translateY(-2px);border-color:#647188}.tower-cell.safe{background:linear-gradient(145deg,#1fe09a,#087a58);border-color:#9affdd;box-shadow:0 0 22px #35e8a055;animation:towerSafe .45s ease}
.tower-cell.mine{background:linear-gradient(145deg,#7a2339,#2b111a);border-color:#ff8096;animation:towerBoom .55s ease}
.tower-cell.reveal{opacity:.65}
@keyframes towerSafe{0%{transform:scale(.75) translateY(10px)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes towerBoom{0%{transform:scale(1)}25%{transform:scale(1.18) rotate(-5deg)}50%{transform:scale(.92) rotate(5deg)}75%{transform:scale(1.08)}100%{transform:scale(1)}}
.tower-shake{animation:towerShake .45s ease}
@keyframes towerShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.tower-rise{animation:towerRise .55s cubic-bezier(.2,.9,.2,1)}
@keyframes towerRise{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}
.task-channel{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #293548;border-radius:16px;background:#101722;margin-top:10px}.task-channel-logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#229ed9;color:white;font-size:24px;font-weight:900}.task-channel a{color:#7ecfff;text-decoration:none;font-weight:900}.task-status{margin-left:auto;font-size:12px;color:#9ca7b8}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="head">
    <div class="brand"><div class="logo">✦</div> NeedCrush</div>
    <div class="balance"><span class="coin">◈</span><span id="balance">0</span></div>
  </div>

const tg=window.Telegram?.WebApp;

let state=JSON.parse(localStorage.getItem("needcrush_"+userId)||"null")||{

state.referrals=state.referrals||[];state.claimed=state.claimed||[];state.referredBy=state.referredBy||null;state.refRewarded=!!state.refRewarded;

function fmt(n){return Math.floor(n).toLocaleString("ru-RU")}
function add(n,reason){if(n<=0)return;state.balance+=Math.floor(n);state.history.unshift({t:new Date().toLocaleTimeString(),r:reason,n:Math.floor(n)});state.history=state.history.slice(0,40);save()}
function spend(n){n=Math.floor(+n);if(!Number.isFinite(n)||n<1){toast("Введите корректную ставку");return false}if(state.balance<n){toast("Не хватает фишек");return false}state.balance-=n;save();return true}
function toast(s){const x=document.createElement("div");x.textContent=s;x.style.cssText="position:fixed;z-index:100;left:50%;bottom:108px;transform:translateX(-50%);background:#f4f0df;color:#11151d;padding:12px 16px;border-radius:14px;font-weight:900;box-shadow:0 10px 35px #0009;max-width:88%;text-align:center";document.body.appendChild(x);setTimeout(()=>x.remove(),1900)}

/* ROCKET */
let rocket={run:false,bet:0,x:1,timer:null,crash:0};
let rocketHistory=[1.18,1.07,1.42,1.31,2.18,1.12,1.76,1.24];
// Консервативное распределение: максимум 30x, а шанс пережить 2x — ровно 30%.
// Чем выше множитель, тем меньше вероятность, что раунд доживёт до него.
function rocketCrashPoint(){
  const r=Math.random();
  if(r<0.35) return 1.02+Math.random()*0.33;      // 35%: 1.02–1.35x
  if(r<0.70) return 1.35+Math.random()*0.65;      // 35%: 1.35–2.00x
  if(r<0.85) return 2.00+Math.random()*1.00;      // 15%: 2–3x
  if(r<0.93) return 3.00+Math.random()*2.00;      // 8%: 3–5x
  if(r<0.98) return 5.00+Math.random()*5.00;      // 5%: 5–10x
  if(r<0.995) return 10.00+Math.random()*10.00;   // 1.5%: 10–20x
  return 20.00+Math.random()*10.00;                // 0.5%: 20–30x
}
function gameRocket(){
 openModal("🚀 Ракета",`
  <div class="mult-history" id="rocketHistory">${rocketHistory.slice(-8).map(x=>`<span class="mh ${x>=2?"good":""}">${x.toFixed(2)}x</span>`).join("")}</div>
  <div class="rocket-box" id="rocketBox">
   <div class="rocket-content"><div class="rocket-x" id="rocketX">1.00x</div><div class="rocket-sub" id="rocketMsg">Приём ставок</div></div>
   <div class="rocket-ship" id="rocketShip">🚀</div>
  </div>
  <label>Ставка</label><input id="rocketBet" type="number" min="1" value="10">
  <div class="cashout-bar" style="margin-top:10px">
   <button class="btn" id="rocketStartBtn" onclick="rocketStart()">🚀 Запустить</button>
   <button class="btn alt" id="rocketCash" disabled onclick="rocketCashout()">Забрать 0</button>
  </div>
  <div class="msg">Множитель растёт постепенно. Забрать можно в любой момент до взрыва.</div>`);
}
function rocketStart(){
 if(rocket.run)return;
 const bet=+document.getElementById("rocketBet").value;if(!spend(bet))return;
 const crash=rocketCrashPoint();
 rocket={run:true,bet,x:1,timer:null,crash};
 rocketX.textContent="1.00x";rocketMsg.textContent="🚀 Полёт начался";rocketMsg.className="live";
 rocketBox.classList.add("live");rocketCash.disabled=true;rocketStartBtn.disabled=true;
 rocket.timer=setInterval(()=>{
  rocket.x+=0.022+rocket.x*0.012;
  rocketX.textContent=rocket.x.toFixed(2)+"x";
  rocketCash.textContent="Забрать "+fmt(Math.floor(rocket.bet*rocket.x));
  if(rocket.x>=1.15)rocketCash.disabled=false;
  if(rocket.x>=rocket.crash)rocketCrash();
 },100);
}
function rocketCrash(){
 if(!rocket.run)return;
 clearInterval(rocket.timer);rocket.run=false;rocketCash.disabled=true;rocketStartBtn.disabled=false;rocketBox.classList.remove("live");
 rocketX.textContent=rocket.crash.toFixed(2)+"x";rocketMsg.textContent="💥 Взрыв на "+rocket.crash.toFixed(2)+"x";rocketMsg.className="crash";
 rocketHistory.push(rocket.crash);rocketHistory=rocketHistory.slice(-16);
 const h=document.getElementById("rocketHistory");if(h)h.innerHTML=rocketHistory.slice(-8).map(x=>`<span class="mh ${x>=2?"good":""}">${x.toFixed(2)}x</span>`).join("");
 state.stats.played++;save();
}
function rocketCashout(silent=false){
 if(!rocket.run)return;
 clearInterval(rocket.timer);rocket.run=false;rocketCash.disabled=true;rocketStartBtn.disabled=false;rocketBox.classList.remove("live");
 const win=Math.floor(rocket.bet*rocket.x);add(win,"Ракета "+rocket.x.toFixed(2)+"x");state.stats.played++;state.stats.wins++;
 rocketMsg.textContent="✅ Забрано "+fmt(win)+" фишек на "+rocket.x.toFixed(2)+"x";rocketMsg.className="live";
 rocketHistory.push(rocket.x);rocketHistory=rocketHistory.slice(-16);
 const h=document.getElementById("rocketHistory");if(h)h.innerHTML=rocketHistory.slice(-8).map(x=>`<span class="mh ${x>=2?"good":""}">${x.toFixed(2)}x</span>`).join("");
 if(!silent)toast("Вы забрали "+fmt(win)+" фишек");
}

/* MINES */
let mineGame=null;
function gameMines(){
 openModal("💣 Мины",`<div class="row"><div><label>Ставка</label><input id="mineBet" type="number" min="1" value="10"></div><div><label>Мин</label><select id="mineCount"><option>4</option><option>6</option><option>8</option></select></div></div><div class="msg" id="mineInfo">Новый раунд — нажмите кнопку.</div><div class="grid3" id="mineGrid" style="margin-top:12px"></div><div class="cashout-bar" style="margin-top:10px"><button class="btn" onclick="mineNew()">Новый раунд</button><button class="btn alt" onclick="mineCashout()">Забрать</button></div>`);
}
function mineNew(){
 if(mineGame?.active){toast("Сначала заберите выигрыш или откройте клетку");return}
 const bet=+mineBet.value;if(!spend(bet))return;
 const count=+mineCount.value;let mines=[];while(mines.length<count){let n=Math.floor(Math.random()*9);if(!mines.includes(n))mines.push(n)}
 mineGame={bet,mines,active:true,safe:0,mult:1};
 mineGrid.innerHTML="";for(let i=0;i<9;i++){const b=document.createElement("button");b.className="cell";b.textContent="?";b.onclick=()=>minePick(i,b);mineGrid.appendChild(b)}
 mineInfo.textContent=`Ставка ${bet}. Забрать можно после первой безопасной клетки.`;
}
function minePick(i,b){
 if(!mineGame?.active||b.textContent!=="?")return;
 if(mineGame.mines.includes(i)){b.classList.add("mine");b.textContent="💣";mineGame.active=false;mineInfo.textContent="💥 Мина! Раунд проигран.";[...mineGrid.children].forEach((x,j)=>{if(mineGame.mines.includes(j))x.textContent="💣"});state.stats.played++;save();return}
 mineGame.safe++;mineGame.mult*=1+(+mineCount.value*.045);b.classList.add("safe");b.textContent="✓";
 const win=Math.floor(mineGame.bet*mineGame.mult);mineInfo.textContent=`Безопасно! ${mineGame.mult.toFixed(2)}x · забрать ${win}`;
 if(mineGame.safe===9-mineGame.mines.length){mineGame.active=false;add(win,"Мины — полный проход");state.stats.played++;state.stats.wins}
 save();
}
function mineCashout(){if(!mineGame?.active||mineGame.safe<1){toast("Сначала откройте безопасную клетку");return}const win=Math.floor(mineGame.bet*mineGame.mult);mineGame.active=false;add(win,"Мины — кэшаут");state.stats.played++;state.stats.wins;mineInfo.textContent="Вы забрали "+win+" фишек.";}

let oreCells=[];
function gameOre(){
 openModal("⛏️ Шахта",`
  <div class="hero"><h1 id="oreOut">Золотая шахта</h1><p>Чем выше ставка, тем выше награда. Золото: <b>+20% от ставки</b>. Алмаз: <b>+50% от ставки</b> и шанс <b>1%</b>.</p></div>

   <div class="stat"><small>Ставка</small><strong id="oreStake">100 ◈</strong></div>

  <button class="btn" onclick="mineOreBoard()">⛏️ Сделать ставку</button>
  <div class="msg" id="oreMsg">Золото: +20% ставки. Алмаз: 1% шанс, +50% ставки. Камень и пустота — проигрыш.</div>`);
 renderOreBoard(Array(15).fill(null));
 document.getElementById("oreBet").oninput=e=>{document.getElementById("oreStake").textContent=fmt(+e.target.value||0)+" ◈"};
}
function oreRollCell(){
 const r=Math.random();
 if(r<0.01)return "diamond";
 if(r<0.16)return "gold";
 if(r<0.46)return "stone";
 return "empty";
}
function renderOreBoard(values){
 oreCells=values;
 oreBoard.innerHTML=values.map(v=>{
  if(v==="diamond")return `<div class="cell safe" style="font-size:24px">💎<br><small>АЛМАЗ</small></div>`;
  if(v==="gold")return `<div class="cell safe" style="font-size:24px">🥇<br><small>ЗОЛОТО</small></div>`;
  if(v==="stone")return `<div class="cell" style="font-size:24px">🪨<br><small>0x</small></div>`;
  return `<div class="cell" style="font-size:25px">·</div>`;
 }).join("");
}
function mineOreBoard(){
 const bet=Math.floor(+document.getElementById("oreBet").value);
 if(!Number.isFinite(bet)||bet<1){toast("Введите корректную ставку");return}
 if(!spend(bet))return;
 // Один результат на раунд: алмаз имеет ровно 1% шанс.
 const r=Math.random();
 const result=r<0.01?"diamond":r<0.16?"gold":r<0.46?"stone":"empty";
 const values=Array(15).fill("empty");
 values[Math.floor(Math.random()*15)]=result;
 renderOreBoard(values);
 let reward=0;
 if(result==="diamond"){
  reward=Math.floor(bet*0.50);
  add(bet+reward,"Шахта — алмаз +50%");
  oreOut.textContent=`💎 АЛМАЗ! +${fmt(reward)} ◈`;
  oreMsg.textContent=`💎 Алмаз! Ставка ${fmt(bet)} ◈ → прибыль +${fmt(reward)} ◈.`;
 }else if(result==="gold"){
  state.gold=(state.gold||0)+1;
  reward=Math.floor(bet*0.20);
  add(bet+reward,"Шахта — золото +20%");
  oreOut.textContent=`🥇 ЗОЛОТО! +${fmt(reward)} ◈`;
  oreMsg.textContent=`🥇 Золото! Ставка ${fmt(bet)} ◈ → прибыль +${fmt(reward)} ◈.`;
 }else if(result==="stone"){
  oreOut.textContent="🪨 Камень — 0x";
  oreMsg.textContent=`🪨 Камень. Ставка ${fmt(bet)} ◈ проиграна.`;
 }else{
  oreOut.textContent="💨 Пустая порода — 0x";
  oreMsg.textContent=`💨 Ничего не найдено. Ставка ${fmt(bet)} ◈ проиграна.`;
 }
 oreGold.textContent=fmt(state.gold||0)+" 🪙";
 save();
}

function gamePlinko(){openModal("🔵 Плинко",`<label>Ставка</label><input id="plinkoBet" type="number" min="1" value="10"><label>Риск</label><select id="plinkoRisk"><option value="low">Низкий</option><option value="mid">Средний</option><option value="high">Высокий</option></select><div class="msg" id="plinkoResult">Нажмите «Бросить».</div><button class="btn" onclick="dropPlinko()">Бросить шар</button>`)}
function weightedPick(items,weights){let r=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i]}return items[items.length-1]}
function dropPlinko(){const bet=+plinkoBet.value;if(!spend(bet))return;const risk=plinkoRisk.value;const cfg=risk==="low"?[[0.2,0.5,0.8,1,1.2,1.5],[30,25,20,13,9,3]]:risk==="mid"?[[0.1,0.3,0.7,1.2,1.8,2.8],[40,28,17,9,5,1]]:[[0,0.1,0.4,0.8,1.5,3,5],[48,25,14,7,4,1.5,.5]];const x=weightedPick(cfg[0],cfg[1]),win=Math.floor(bet*x);if(win)add(win,"Плинко "+x+"x");plinkoResult.textContent=`Шар упал в ${x}x → ${win?"+":""}${win} фишек`}

const CASES=[
 {id:"starter",icon:"📦",name:"Стартовый",price:20,rewards:[0,10,20,30,50,80,120]},
 {id:"silver",icon:"🥈",name:"Серебряный",price:100,rewards:[20,50,80,120,180,250,400]},

 {id:"diamond",icon:"💎",name:"Алмазный",price:2000,rewards:[400,800,1500,2500,4000,7000,12000]},

];
function gameCases(){
  openModal("📦 Кейсы",`
    <p class="notice">Открывай кейс и смотри анимацию выпадения награды.</p>
    <div class="case-grid">${CASES.map(c=>`
      <button class="case-item" onclick="openCase('${c.id}')"><div class="case-icon">${c.icon}</div><h3>${c.name}</h3><p>До ${fmt(Math.max(...c.rewards))} ◈</p><div class="case-price">${fmt(c.price)} ◈</div></button>`).join("")}</div>
    <div id="caseStage" style="display:none"></div>
    <div class="msg" id="caseResult">Выберите кейс.</div>`);
}
function openCase(id){
  const c=CASES.find(x=>x.id===id);if(!c)return;
  if(window.caseBusy){toast("Кейс уже открывается");return}
  if(!spend(c.price))return;
  window.caseBusy=true;
  const stage=document.getElementById("caseStage"),out=document.getElementById("caseResult");
  if(stage)stage.innerHTML=`<div class="case-open-stage"><div class="case-glow"></div><div class="case-box opening" id="caseBox">${c.icon}</div><div class="case-burst" id="caseBurst">✨</div><div class="case-reward" id="caseReward"></div></div>`;
  if(stage)stage.style.display="block"; if(out)out.textContent="Открываем кейс...";
  const weights=c.rewards.map((_,i)=>[52,23,12,6,4,2,1][i]);
  let r=Math.random()*weights.reduce((a,b)=>a+b,0),idx=0;
  for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0){idx=i;break}}
  const n=c.rewards[idx];
  setTimeout(()=>{
    const box=document.getElementById("caseBox"),burst=document.getElementById("caseBurst"),reward=document.getElementById("caseReward");
    if(box){box.classList.remove("opening");box.textContent="🎁";box.style.transform="scale(1.25)"}
    if(burst)burst.classList.add("show");
    if(n)add(n,`Кейс ${c.name}`);
    if(reward){reward.innerHTML=n?`🎉 +${fmt(n)} ◈`:`💨 Пусто`;reward.classList.add("show")}
    if(out)out.innerHTML=`${c.icon} <b>${c.name}</b>: ${n?`+${fmt(n)} фишек`:`пусто`}`;
    window.caseBusy=false;
  },1450);
}

 }
 b.className="tower-cell safe";b.textContent="✓";

 towerX.textContent=towerState.x.toFixed(2)+"x";

 setTimeout(()=>{if(!towerState.active)return;towerState.floor++;towerState.mines=pickTowerMines();renderTower(true)},650);

function chooseUpgradeV2(x,el){
  if(upgradeBusy)return;
  upgradeTarget=x;
  const chance=UPGRADE_CHANCES[x]??49.5;
  const bet=Math.max(1,Math.floor(+document.getElementById("upBet")?.value||upgradeAmount));

  document.querySelectorAll(".upgrade-amount").forEach(b=>b.classList.remove("active"));

function setUpgradeHalf(){
  const inp=document.getElementById("upBet"); if(!inp)return;
  inp.value=Math.max(1,Math.floor(state.balance/2)); upgradeAmount=+inp.value;
  const p=document.getElementById("upPossible");if(p)p.textContent=fmt(upgradeAmount*upgradeTarget);
}
function setUpgradeMax(){
  const inp=document.getElementById("upBet"); if(!inp)return;
  inp.value=Math.max(1,state.balance); upgradeAmount=+inp.value;
  const p=document.getElementById("upPossible");if(p)p.textContent=fmt(upgradeAmount*upgradeTarget);
}
function upgradeV2(){
  if(upgradeBusy)return;
  const inp=document.getElementById("upBet"),bet=Math.floor(+inp.value),target=upgradeTarget;
  if(!Number.isFinite(bet)||bet<1){toast("Введите корректную ставку");return}
  if(!spend(bet))return;

  upgradeAmount=bet; upgradeBusy=true;
  const ring=document.getElementById("upRing"),btn=document.getElementById("upBtn"),msg=document.getElementById("upMsg");
  const result=document.getElementById("upResult");
  const chance=UPGRADE_CHANCES[target]??(99/target);

  // The wheel is purely visual now: there is no green winning area.
  // The final sector is used to determine the result according to the selected chance.
  const finalRotation=1440 + Math.random()*360;
  const pointerAngle=(360-(finalRotation%360))%360;
  const success=pointerAngle < (360*(chance/100));

  if(result){result.textContent="";result.className="upgrade-result";}
  btn.disabled=true;
  msg.textContent="🎯 Колесо вращается...";
  msg.style.borderColor="";

  ring.style.transition="none";
  ring.style.transform="rotate(0deg)";
  void ring.offsetWidth;
  ring.style.transition="transform 2.8s cubic-bezier(.08,.76,.08,1)";
  ring.style.transform=`rotate(${finalRotation}deg)`;

  setTimeout(()=>{
    if(success){
      const win=Math.floor(bet*target);
      add(win,"Апгрейдер "+target+"x");
      if(result){result.textContent="ПОБЕДА";result.className="upgrade-result show win";}
      msg.innerHTML=`🎉 Вы выиграли <b>${fmt(win)}</b> фишек`;
      msg.style.borderColor="#36d59b";
    }else{
      if(result){result.textContent="НЕУДАЧА";result.className="upgrade-result show lose";}
      msg.innerHTML=`💥 Ставка <b>${fmt(bet)}</b> сгорела`;
      msg.style.borderColor="#ff667e";
    }
    state.stats.played++;
    if(success)state.stats.wins++;
    save();
    upgradeBusy=false;
    btn.disabled=false;
  },2850);
}

/* CLICKER */
const CLICKER_HOURLY_LIMIT=500, CLICKER_BAN_MS=30*60*1000;
let clickerLastAt=0;
function clickerResetWindow(){
  const now=Date.now();
  if(now-state.clicker.hourStarted>=3600000){
    state.clicker.hourStarted=now;state.clicker.hourClicks=0;state.clicker.intervals=[];save();
  }
}
function clickerStatus(){
  clickerResetWindow();
  const now=Date.now(),left=Math.max(0,state.clicker.bannedUntil-now);
  if(left>0)return {banned:true,left};
  return {banned:false,left:0,remaining:Math.max(0,CLICKER_HOURLY_LIMIT-state.clicker.hourClicks)};
}
function gameClicker(){
  clickerResetWindow();
  const st=clickerStatus();
  openModal("⚡ Кликер",`
    <div class="hero ${st.banned?'clicker-ban':''}">
      <h1 id="clickCount">${fmt(state.clicks)}</h1>
      <p>${st.banned?'⛔ Кликер временно заблокирован за подозрительную активность.':'Каждый честный клик = 1 фишка. Лимит — 500 фишек в час.'}</p>
    </div>
    <div class="statgrid">
      <div class="stat"><small>Доступно в час</small><strong id="clickRemaining">${st.banned?'—':st.remaining}</strong></div>
      <div class="stat"><small>До снятия бана</small><strong id="clickBanTimer">${st.banned?formatBanTime(st.left):'—'}</strong></div>
    </div>
    <div class="clicker-zone"><button class="clicker-btn" id="clickerBtn" ${st.banned||st.remaining<=0?'disabled':''} onclick="clickMine()">+1 ◈</button></div>
    <div class="msg" id="clickerMsg">${st.banned?'Попробуйте снова после окончания блокировки.':st.remaining<=0?'Лимит 500 фишек на этот час достигнут.':'Не используйте автокликеры: серия слишком быстрых/ритмичных кликов приводит к бану на 30 минут.'}</div>`);
  if(st.banned)startBanTimer();
}
function formatBanTime(ms){
  const s=Math.ceil(ms/1000),m=Math.floor(s/60),sec=s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
let banTimer=null;
function startBanTimer(){
  clearInterval(banTimer);
  banTimer=setInterval(()=>{
    const el=document.getElementById("clickBanTimer"),btn=document.getElementById("clickerBtn"),msg=document.getElementById("clickerMsg");
    const st=clickerStatus();
    if(!el){clearInterval(banTimer);return}
    if(st.banned){el.textContent=formatBanTime(st.left);if(btn)btn.disabled=true}
    else {clearInterval(banTimer);el.textContent="—";if(btn)btn.disabled=state.clicker.hourClicks>=CLICKER_HOURLY_LIMIT;if(msg)msg.textContent="Блокировка снята. Можно снова кликать."}
  },1000);
}
function triggerClickerBan(reason){
  state.clicker.bannedUntil=Date.now()+CLICKER_BAN_MS;
  state.clicker.intervals=[];save();
  const msg=document.getElementById("clickerMsg");if(msg)msg.textContent="⛔ "+reason+" Бан на 30 минут.";
  const btn=document.getElementById("clickerBtn");if(btn)btn.disabled=true;
  startBanTimer();toast("Кликер заблокирован на 30 минут");
}
function clickMine(){
  const now=Date.now();clickerResetWindow();
  const st=clickerStatus();
  if(st.banned){startBanTimer();toast("Кликер временно заблокирован");return}
  if(state.clicker.hourClicks>=CLICKER_HOURLY_LIMIT){toast("Лимит 500 фишек в час достигнут");return}
  if(clickerLastAt){
    const dt=now-clickerLastAt;
    state.clicker.intervals.push(dt);
    state.clicker.intervals=state.clicker.intervals.slice(-20);
    /* Heuristic client-side detection; real enforcement must also be server-side. */
    const recent=state.clicker.intervals.slice(-8);
    const veryFast=recent.length>=6 && recent.every(x=>x<90);
    const robotic=recent.length>=10 && (Math.max(...recent)-Math.min(...recent)<=8) && recent.every(x=>x<220);
    if(veryFast||robotic){triggerClickerBan(veryFast?"Обнаружены слишком быстрые клики.":"Обнаружен ритмичный паттерн автокликера.");return}
  }
  clickerLastAt=now;state.clicker.hourClicks++;state.clicks++;add(1,"Кликер");
  const a=document.getElementById("clickCount"),b=document.getElementById("clickRemaining"),c=document.getElementById("clickCount2");
  if(a)a.textContent=fmt(state.clicks);if(c)c.textContent=fmt(state.clicks);if(b)b.textContent=CLICKER_HOURLY_LIMIT-state.clicker.hourClicks;
}

async function shareReferral(){

 if(navigator.share){try{await navigator.share({title:"NeedCrush",text,url:link})}catch(e){}}

}

/* TASKS */
const NEEDCRUSH_CHANNEL="NeedCrash";
const NEEDCRUSH_CHANNEL_URL="https://t.me/NeedCrash";
const TASK_REWARD=5000;
function openTasks(){
  const claimed=state.claimed||[];
  const done=claimed.includes("needcrush_channel");
  openModal("◇ Задания",`
    <div class="hero"><h1>Задания</h1><p>Подпишись на наш канал и получи бонус.</p></div>
    <div class="task-card">
      <div class="task-head"><div class="task-icon">✈️</div><div><h3>Подписка на канал</h3><p>Награда за подтверждённую подписку</p></div></div>
      <div class="task-channel"><div class="task-channel-logo">✈</div><div><a href="https://t.me/NeedCrash" target="_blank" onclick="openNeedCrashChannel();return false">@NeedCrash</a><div style="color:#8f99a9;font-size:12px;margin-top:2px">Telegram-канал</div></div><div class="task-status">+${fmt(TASK_REWARD)} ◈</div></div>
      <button class="btn alt" onclick="openNeedCrashChannel()">📢 Подписаться на канал</button>
      <button class="btn green" id="subCheckBtn" ${done?'disabled':''} onclick="checkNeedCrashSubscription()">${done?'✓ Подписка подтверждена':'✓ Проверить подписку'}</button>
      <div class="notice">После подписки нажми «Проверить подписку». Награда <b>5000 ◈</b> выдаётся только после подтверждения Telegram.</div>
    </div>`);
}
function openNeedCrashChannel(){
  try{tg?.openTelegramLink?.(NEEDCRUSH_CHANNEL_URL)}catch(e){}
  if(!tg?.openTelegramLink)window.open(NEEDCRUSH_CHANNEL_URL,"_blank");
}
// URL сервера проверки. Если фронтенд и сервер на одном домене, оставь как есть.
const SUBSCRIPTION_CHECK_API=window.NEEDCRUSH_SUBSCRIPTION_API||"/api/check-subscription";
async function checkNeedCrashSubscription(){
  if((state.claimed||[]).includes("needcrush_channel")){toast("Награда уже получена");return}
  const btn=document.getElementById("subCheckBtn");
  if(btn){btn.disabled=true;btn.textContent="Проверяем..."}
  try{
    if(!tg?.initData){throw new Error("NO_TELEGRAM_INIT_DATA")}
    const resp=await fetch(SUBSCRIPTION_CHECK_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user_id:userId,channel:"@"+NEEDCRUSH_CHANNEL,initData:tg.initData})
    });
    let data=null;
    try{data=await resp.json()}catch(_){throw new Error("BAD_SERVER_RESPONSE")}
    if(!resp.ok)throw new Error(data?.error||("HTTP_"+resp.status));
    if(data?.ok&&data?.subscribed){
      state.claimed=state.claimed||[];
      state.claimed.push("needcrush_channel");
      add(TASK_REWARD,"Задание: подписка на @NeedCrash");
      if(btn){btn.textContent="✓ Награда получена"}
      toast("+5000 фишек за подписку");
      return;
    }
    if(btn){btn.disabled=false;btn.textContent="Проверить подписку"}
    toast(data?.message||"Подписка не подтверждена. Подпишитесь на @NeedCrash и попробуйте ещё раз.");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Проверить подписку"}
    if(e?.message==="NO_TELEGRAM_INIT_DATA")toast("Проверка работает только при запуске через Telegram Web App");
    else toast("Не удалось проверить подписку: "+(e?.message||"сервер недоступен"));
  }
}

 else openModal(titles[b.dataset.nav],`<div class="hero"><h1>${titles[b.dataset.nav]}</h1><p>${b.dataset.nav==="tasks"?"Раздел заданий готов для расширения.":"Социальные функции можно подключить отдельно."}</p></div>`);
});

processIncomingReferral();updateUI();renderGames();renderAdmin();
</script>
